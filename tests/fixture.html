<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>AutoType test bench</title>
<style>body{font:16px system-ui;max-width:760px;margin:48px auto;padding:0 24px;color:#26372e;background:#f7f5ee}label{display:block;margin:24px 0 8px}input,textarea,[contenteditable]{font:inherit;width:100%;box-sizing:border-box;padding:12px;border:1px solid #aab4a5;border-radius:6px;background:#fffefa;white-space:pre-wrap;min-height:48px}textarea,[contenteditable]{min-height:100px}button{margin:16px 0}iframe{width:100%;height:150px}#submits{color:#9c3827}</style>
<h1>AutoType test bench</h1>
<p>Local fixtures. Use only disposable sample text.</p>
<form id="form">
  <label for="single">Single-line text</label><input id="single" value="Before after">
  <label for="multi">Multiline text</label><textarea id="multi"></textarea>
  <button>Submit fixture</button><span id="submits">0 submits</span>
</form>
<label for="rich">Contenteditable</label><div id="rich" contenteditable="true" role="textbox" aria-multiline="true"></div>
<label for="secret">Password (must reject)</label><input id="secret" type="password">
<label for="readonly">Read-only (must reject)</label><input id="readonly" readonly value="Do not change">
<label for="disabled">Disabled (must reject)</label><textarea id="disabled" disabled>Do not change</textarea>
<label>Same-origin embedded editor</label><iframe title="Same-origin editor" src="frame.html"></iframe>
<label>Cross-origin embedded editor (must reject)</label><iframe title="Cross-origin editor" src="http://localhost:8765/tests/frame.html"></iframe>
<label>Open shadow-root editor</label><div id="shadow-host"></div>
<script>let submissions=0;document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('submits').textContent=`${++submissions} submits`});</script>
<script>document.getElementById('shadow-host').attachShadow({mode:'open'}).innerHTML='<label for="shadow">Shadow text</label><textarea id="shadow" rows="4"></textarea>';</script>
</html>
